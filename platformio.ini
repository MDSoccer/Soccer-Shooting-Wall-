; PlatformIO project for the DIY Smart Soccer Target Wall.
;
; env:featheresp32s3  -> real firmware for the Adafruit ESP32-S3 Feather
; env:native          -> hardware-free unit tests for the game logic (lib/game_core)

[env:featheresp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
build_flags =
    -std=gnu++17

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
