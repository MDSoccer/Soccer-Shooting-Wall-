; PlatformIO project for the DIY Smart Soccer Target Wall
; Phase 1: single-panel prototype (see project plan)

[env:adafruit_feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
build_flags =
    -DCORE_DEBUG_LEVEL=3
